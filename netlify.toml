# Story OS (July 2026 build, recovered from the live site on 2026-09-27).
# No build step: `site/` is the finished app. Deploy from the repo root so Netlify
# picks up this file, the redirect below, and the function.

[build]
  publish = "site"
  command = "echo 'prebuilt site - no build step'"

[functions]
  directory = "netlify/functions"

# Route the app's AI calls to the proxy function. Must come before the SPA fallback.
[[redirects]]
  from = "/api/anthropic/*"
  to = "/.netlify/functions/anthropic"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
